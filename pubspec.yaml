name: fleet_scan
description: GSCWD Fleet Trip Ticket QR scanner.
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  qr_code_scanner_plus: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: false
  image_path: 'assets/gwd_logo.png'
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/gwd_logo.png
    - assets/tubig_connect_logo.png
    - assets/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/Inter.ttf
